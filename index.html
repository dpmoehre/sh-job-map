<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>私人页面</title>
<style id="lkcss">
html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#10305a 0%,#071222 70%);color:#dfe8f5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#lk{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;box-sizing:border-box}
.box{width:min(360px,100%);background:#0b1a2ecc;border:1px solid #1f4d7a;border-radius:10px;padding:22px;box-shadow:0 0 30px #5fd3ff22}
h1{margin:0 0 6px;font-size:18px;color:#5fd3ff}p{font-size:12px;color:#9fb3c8;margin:0 0 14px}
input[type=password]{width:100%;box-sizing:border-box;font-size:18px;padding:10px;border-radius:8px;border:1px solid #2c5280;background:#0f2238;color:#fff;letter-spacing:3px}
button{width:100%;margin-top:12px;padding:10px;font-size:16px;border:none;border-radius:8px;background:#5fd3ff;color:#0b1a2e;font-weight:bold}
label{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:10px;color:#9fb3c8}#msg{min-height:18px;font-size:13px;margin-top:8px;color:#f87171}
</style></head><body><div id="lk"><form class="box" id="f" autocomplete="off"><h1>🔒 请输入访问密码</h1><p>页面内容已加密，只在你的浏览器里解密。</p>
<input type="password" id="pw" inputmode="numeric" placeholder="密码" autofocus>
<label><input type="checkbox" id="rm" checked> 在此设备记住（可在页面内“锁定”清除）</label>
<button id="go" type="submit">解锁</button><div id="msg"></div></form></div>
<script>
const SALT='/1W97P62n4i5AtvNdyC74w==',ITER=1000000,V='cdafd72393',KS='shjm_key_v1:'+SALT;
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
let KEY=null;
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
const CN='shjm-bin-v1';
/* app.bin 密文缓存在 Cache Storage（只存密文，按版本号命名，旧版本自动删除）；附件按需下载 */
async function fetchBin(name){const url='d/'+name+'.bin?v='+V;let c=null;
  if(name==='app'){try{c=await caches.open(CN);const m=await c.match(url);if(m)return new Uint8Array(await m.arrayBuffer());}catch(e){c=null;}}
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const ab=await r.arrayBuffer();
  if(c){try{await c.put(url,new Response(ab.slice(0)));for(const k of await c.keys())if(!k.url.endsWith('v='+V))c.delete(k);}catch(e){}}
  return new Uint8Array(ab);}
async function getBin(name){const u=await fetchBin(name);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12));}
async function gunz(buf){const u=new Uint8Array(buf);if(u[0]!==0x1f||u[1]!==0x8b)return buf;return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();}
let APP=null;
function loadJS(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('加载失败 '+src));document.head.appendChild(s);});}
function loadCSS(href){const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l);}
let LIBS=null;const libs=()=>LIBS||(LIBS=(loadCSS('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'),Promise.all([loadJS('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'),loadJS('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js')])));
async function boot(){const raw=APP||await gunz(await getBin('app'));APP=null;const P=JSON.parse(new TextDecoder().decode(raw));
  await libs();
  document.title=P.title;document.getElementById('lkcss').remove();document.body.removeAttribute('style');const st=document.createElement('style');st.textContent=P.css;document.head.appendChild(st);
  document.body.innerHTML=P.html;
  const BOOT={data:P.data,getFile:getBin,logout(){localStorage.removeItem(KS);location.reload();}};
  new Function('BOOT',P.js)(BOOT);}
async function tryKey(k){KEY=k;try{APP=await gunz(await getBin('app'));return true;}catch(e){if(String(e.message).startsWith('HTTP'))throw e;KEY=null;return false;}}
const msg=document.getElementById('msg');
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;if(!pw)return;
  msg.style.color='#9fb3c8';msg.textContent='正在验证…';document.getElementById('go').disabled=true;
  try{const k=await derive(pw);if(await tryKey(k)){if(document.getElementById('rm').checked)localStorage.setItem(KS,b64e(await crypto.subtle.exportKey('raw',k)));msg.textContent='解锁成功，加载中…';await boot();}
    else{msg.style.color='#f87171';msg.textContent='密码错误';}}catch(err){msg.style.color='#f87171';msg.textContent='出错：'+err.message;}
  const g=document.getElementById('go');if(g)g.disabled=false;};
(async()=>{const s=localStorage.getItem(KS);if(!s)return;libs();msg.style.color='#9fb3c8';msg.textContent='已记住此设备，解锁中…';
  try{const k=await crypto.subtle.importKey('raw',b64d(s),{name:'AES-GCM'},true,['decrypt']);if(await tryKey(k)){await boot();return;}}catch(e){}
  localStorage.removeItem(KS);msg.textContent='';})();
</script></body></html>
